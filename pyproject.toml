[tool.poetry]
name = "football-ingest"
version = "0.1.0"
description = "Phase-1: SportMonks -> Supabase ingestion pipeline"
authors = ["Your Team <team@example.com>"]
readme = "README.md"
packages = [{include = "app", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
httpx = {version = "^0.27.0", extras = ["http2"]}
tenacity = "^8.2.3"
pydantic = "^2.8.2"
pydantic-settings = "^2.3.4"
SQLAlchemy = "^2.0.32"
alembic = "^1.13.2"
psycopg = {version="^3.2.1", extras=["binary"]}
redis = "^5.0.7"
celery = "^5.4.0"
python-dotenv = "^1.0.1"
typer = "^0.12.3"
orjson = "^3.10.7"
pendulum = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-httpx = "^0.30.0"
ruff = "^0.5.7"
mypy = "^1.11.1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "S", "B", "A", "COM", "C4", "DTZ", "T10", "EXE", "ISC", "ICN", "G", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = ["ANN101", "ANN102", "S101", "PLR0913", "PLR0917"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"